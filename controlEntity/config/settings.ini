[HMI]
sampling_rate_ms = 50
address = 1

[RPI]
evoflow_reset_gpio_pin = 17
evoflow_status_gpio_pin = 27

[Evoflow]
port_windows = COM6
port_macos = /dev/cu.usbserial-AB0P7C53
; port_macos = /dev/cu.usbserial-DQ015HRV
port_linux = /dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DQ015HRV-if00-port0
serial_timeout = 0.03
baudrate = 921600
address = 100
auto_reset_after_seconds = 30
motor_cut_off_temp = 68.0

[ODController]
V0 = 30.0
A0 = 0.63
mu0 = 0.000256
kp = -0.00864
ki = -0.0000108
q_max = 0.01111111111111112
q_lagoon_max = 0.00778
Ts = 0.5
A_setpoint = 0.65
f = 2.5
Tb = 50

; V0 (ml) Volume of the bioreactor
; A0 (OD) Initial optical density
; mu0 (1/s) bacterial growth
; kp (ml/s)
; ki (ml/s^2)
; q_max (ml/s) Maximum flow rate of the pump
; q_lagoon_max (ml/s) Maximum flow rate of the lagoon pump to keep the bioreator volume constant
; Ts (s) Sampling time for the control loop
; A_setpoint (OD) Setpoint for the optical density
; f (%) Fraction of the q_max that allows the integral to contribute to the control action. (anti_windup_limit = (f * q_max)/(V0 * ki)) -> Systematic tuning
; Tb (s) Time constant for back-calculation anti-windup. (back_calculation_gain = Ts/(Tb * V0 * ki)) -> Systematic tuning

[SampleExtraction]
port_windows = COM7
port_macos = /dev/cu.usbserial-FTDI_SAMPLE_EXTRACTOR
port_linux = /dev/ttyUSB1
serial_timeout = 0.5
baudrate = 921600
address = 101

[defaultValues]
pump1_flow = 0.0
pump2_flow = 0.0
pump3_flow = 0.0
pump4_flow = 0.0
magneticStirrer_bioreactor_rpm = 3000
magneticStirrer_lagoon_rpm = 3000
tempCtrl_bioreactor_sp = 37
tempCtrl_lagoon_sp = 37

[defaultComponentStatus]
pump1_status = False
pump2_status = False
pump3_status = False
pump4_status = False
magneticStirrer_bioreactor_status = False
magneticStirrer_lagoon_status = False
tempCtrl_bioreactor_status = False
tempCtrl_lagoon_status = False
od_bioreactor_status = False
od_lagoon_status = False
od_lagoon_enabled = False
phtCount_status = False
sug2lagValve_status = False
bio2lagValve_status = False

[flowRateConversionFactors]
; Fitted polynomial coefficients for Pump 2: [-4.44852992e-03  4.43514449e+00  1.06484094e+01]
; R-squared value: 0.9996
; Fitted polynomial coefficients for Pump 5: [-3.56552181e-03  4.11150096e+00  8.21242597e+00]
; R-squared value: 0.9995
pump_1 = -3.56552181e-03,4.11150096e+00,8.21242597e+00
pump_2 = -4.44852992e-03,4.43514449e+00,1.06484094e+01
pump_3 = 0.0,1.0,0.0
pump_4 = 0.0,1.0,0.0

[plotConfiguration]
timespan_minutes = 5
sampling_time_seconds = 5
y_axis_flowRate_min = 0
y_axis_flowRate_max = 5
y_axis_phtCount_min = 0
y_axis_phtCount_max = 40
y_axis_temp_min = 20
y_axis_temp_max = 40
y_axis_od_min = 0
y_axis_od_max = 1.5
scrollbar_max_loading_value = 2500
max_data_points_to_load = 7200

[dataLogging]
max_rows_per_db = 10000
