[HMI]
sampling_rate_ms = 100
address = 1

[RPI]
evoflow_reset_gpio_pin = 17
evoflow_status_gpio_pin = 27


[Evoflow]
port_windows = COM6
port_macos = /dev/cu.usbserial-DK0GU7KF
port_linux = /dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DK0GU7KF-if00-port0
serial_timeout = 0.09
baudrate = 921600
address = 100
auto_reset_after_seconds = 30

[SampleExtraction]
port_windows = COM7
port_macos = /dev/cu.usbserial-FTDI_SAMPLE_EXTRACTOR
port_linux = /dev/ttyUSB1
serial_timeout = 0.5
baudrate = 921600
address = 101

[defaultValues]
pump1_rpm = 2.0
pump2_rpm = 3.0
pump3_rpm = 1.5
pump4_rpm = 2.5
magneticStirrer_bioreactor_rpm = 3000
magneticStirrer_lagoon_rpm = 3000
tempCtrl_bioreactor_sp = 37
tempCtrl_lagoon_sp = 37

[defaultComponentStatus]
pump1_status = False
pump2_status = False
pump3_status = False
pump4_status = False
magneticStirrer_bioreactor_status = False
magneticStirrer_lagoon_status = False
tempCtrl_bioreactor_status = False
tempCtrl_lagoon_status = False
od_bioreactor_status = False
od_lagoon_status = False
od_lagoon_enabled = False
phtCount_status = False
sug2lagValve_status = False
bio2lagValve_status = False

[flowRateConversionFactors]
pump_1 = 1.0
pump_2 = 1.0
pump_3 = 1.0
pump_4 = 1.0

[plotConfiguration]
timespan_minutes = 5
sampling_time_seconds = 5
y_axis_flowRate_min = 0
y_axis_flowRate_max = 5
y_axis_phtCount_min = 0
y_axis_phtCount_max = 40
y_axis_temp_min = 20
y_axis_temp_max = 40
y_axis_od_min = 0
y_axis_od_max = 1.5
scrollbar_max_loading_value = 2500
max_data_points_to_load = 7200

[dataLogging]
max_rows_per_db = 10000
