[HMI]
sampling_rate_ms = 100
address = 1

[RPI]
evoflow_reset_gpio_pin = 17
evoflow_status_gpio_pin = 27

[Evoflow]
port_windows = COM6
port_macos = /dev/cu.usbserial-AB0P7C53
; port_macos = /dev/cu.usbserial-DQ015HRV
port_linux = /dev/serial/by-id/usb-FTDI_FT230X_Basic_UART_DQ015HRV-if00-port0
serial_timeout = 0.09
baudrate = 921600
address = 100
auto_reset_after_seconds = 30
motor_cut_off_temp = 68.0

[ODController]
V0 = 30.0
A0 = 0.5
mu0 = 0.000
kp = -3.0
ki = -0.0017
q_max = 0.03
q_lagoon_max = 0.00778
Ts = 1
A_setpoint = 0.65
f = 1.2
Tb = 30

; V0 (ml) Volume of the bioreactor
; A0 (OD) Initial optical density
; mu0 (1/s) bacterial growth
; kp (ml/s)
; ki (ml/s^2)
; q_max (ml/s) Maximum flow rate of the pump
; q_lagoon_max (ml/s) Maximum flow rate of the lagoon pump to keep the bioreator volume constant
; Ts (s) Sampling time for the control loop
; A_setpoint (OD) Setpoint for the optical density
; f (%) Fraction of the q_max that allows the integral to contribute to the control action. (anti_windup_limit = (f * q_max)/(V0 * ki)) -> Systematic tuning
; Tb (s) Time constant for back-calculation anti-windup. (back_calculation_gain = Ts/(Tb * V0 * ki)) -> Systematic tuning

[SampleExtraction]
port_windows = COM7
port_macos = /dev/cu.usbserial-FTDI_SAMPLE_EXTRACTOR
port_linux = /dev/ttyUSB1
serial_timeout = 0.5
baudrate = 921600
address = 101

[defaultValues]
pump1_flow = 0.0
pump2_flow = 0.0
pump3_flow = 0.0
pump4_flow = 0.0
magneticStirrer_bioreactor_rpm = 1000
magneticStirrer_lagoon_rpm = 1000
tempCtrl_bioreactor_sp = 37
tempCtrl_lagoon_sp = 37

[defaultComponentStatus]
pump1_status = False
pump2_status = False
pump3_status = False
pump4_status = False
magneticStirrer_bioreactor_status = False
magneticStirrer_lagoon_status = False
tempCtrl_bioreactor_status = False
tempCtrl_lagoon_status = False
od_bioreactor_status = False
od_lagoon_status = False
od_lagoon_enabled = False
phtCount_status = False
sug2lagValve_status = False
bio2lagValve_status = False

[flowRateConversionFactors]
; These coefficients are for calculating Flow = a * RPM^2 + b * RPM + c, where Flow is in uL/min and RPM is the pump speed.
; Fitted polynomial coefficients for Pump 1: [-0.46603084 47.34773116  5.86788252]
; R-squared value: 0.9993
; Fitted polynomial coefficients for Pump 2: [-0.32607593 44.84457435  9.23906568]
; R-squared value: 0.9999
; Fitted polynomial coefficients for Pump 3: [-0.37130707 42.08335078  5.69389342]
; R-squared value: 0.9979
; Fitted polynomial coefficients for Pump 4: [-0.36201913 45.31712948  6.13305734]
; R-squared value: 1.0000

; These coefficients are for calculating RPM = a * Flow^2 + b * Flow + c, where Flow is in uL/min and RPM is the pump speed.
; Fitted polynomial coefficients for Pump 1: [ 7.18142719e-06  2.01823488e-02 -5.86341949e-02]
; R-squared value: 0.9991
; Fitted polynomial coefficients for Pump 2: [ 5.22387452e-06  2.17288118e-02 -1.69904015e-01]
; R-squared value: 1.0000
; Fitted polynomial coefficients for Pump 3: [ 7.10965277e-06  2.32695903e-02 -1.15531072e-01]
; R-squared value: 0.9975
; Fitted polynomial coefficients for Pump 4: [ 6.67415578e-06  2.09923558e-02 -7.61622748e-02]
; R-squared value: 0.9999
pump_1 = 7.18142719e-06,2.01823488e-02,-5.86341949e-02
pump_2 = 5.22387452e-06,2.17288118e-02,-1.69904015e-01
pump_3 = 7.10965277e-06,2.32695903e-02,-1.15531072e-01
pump_4 = 6.67415578e-06,2.09923558e-02,-7.61622748e-02

[plotConfiguration]
timespan_minutes = 5
sampling_time_seconds = 1
y_axis_flowRate_min = 0
y_axis_flowRate_max = 1000
y_axis_phtCount_min = 0
y_axis_phtCount_max = 40
y_axis_temp_min = 20
y_axis_temp_max = 40
y_axis_od_min = 0
y_axis_od_max = 1.2
